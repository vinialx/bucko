<svg width="220" height="220" viewBox="0 0 220 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Bucko icon — white</title>

  <g transform="translate(110, 112)">
    <!-- corpo: apenas borda, interior transparente -->
    <rect x="-68" y="-42" width="136" height="82" rx="11" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
    <rect x="-60" y="-34" width="120" height="66" rx="7" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <rect x="-56" y="-30" width="112" height="58" rx="5" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    <!-- listra esquerda: só outline -->
    <rect x="-68" y="-42" width="26" height="82" rx="11" fill="none" stroke="#ffffff" stroke-width="0" opacity="0"/>
    <line x1="-42" y1="-42" x2="-42" y2="40" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <!-- linhas decorativas -->
    <rect x="22" y="-26" width="30" height="3" rx="1.5" fill="#ffffff" opacity="0.3"/>
    <rect x="22" y="-18" width="20" height="3" rx="1.5" fill="#ffffff" opacity="0.2"/>
    <!-- marca d'água: só anel -->
    <circle cx="0" cy="-2" r="25" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
    <circle cx="0" cy="-2" r="19" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="24" font-weight="700" fill="#ffffff" opacity="0.9">B</text>
    <circle cx="42" cy="22" r="2.5" fill="#ffffff" opacity="0.25"/>
    <circle cx="50" cy="22" r="2.5" fill="#ffffff" opacity="0.15"/>
  </g>
</svg>
